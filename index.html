<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="styles.css" />
		<title>Rock Paper Scissors</title>
	</head>
	<body>
		<h1>Rock - Paper - Scissors Game</h1>

		<div class="buttons-container">
			<button id="rock">
				<img
					src="assets/hand-back-fist-solid.png"
					alt="Rock"
					class="btn-icon"
				/>
			</button>
			<button id="paper">
				<img src="assets/hand-solid.png" alt="Paper" class="btn-icon" />
			</button>
			<button id="scissors">
				<img
					src="assets/hand-scissors-solid.png"
					alt="Scissors"
					class="btn-icon"
				/>
			</button>
		</div>

		<div class="game-info">
			<div class="round"></div>
			<div class="score"></div>
			<div class="result"></div>
		</div>

		<script src="script.js"></script>
	</body>
</html>
